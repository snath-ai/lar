[tool.poetry]
name = "lar-engine"
version = "2.2.3"
description = "Lár: The PyTorch for Agents. A 'define-by-run' agentic framework."
authors = ["Aadithya Vishnu Sajeev <axdithya@snath.ai>"]
maintainers = ["Aadithya Vishnu Sajeev <axdithya@snath.ai>", "Vinay S <vinay@snath.ai>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "lar", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
typer = "^0.12.0"

litellm = "^1.97"
rich = "^14.2.0"
pydantic = "^2.0.0"
networkx = "^3.0.0"
deepdiff = "^8.6.1"
urllib3 = ">=2.7.0"
filelock = "^3.20.1"
setuptools = "^83.0.0"
idna = "^3.15"

[tool.poetry.scripts]
lar = "lar.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
python-dotenv = "^1.2.2"

[tool.poetry.group.docs.dependencies] 
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.15" 
pymdown-extensions = "^11.0.1"


[tool.poetry.group.comparison.dependencies]
langgraph = "^1.2"
langchain-core = "^1.5"
langchain-ollama = "^1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"