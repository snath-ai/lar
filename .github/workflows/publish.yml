name: Publish lar-engine to GitHub Packages

# Trigger: create a GitHub Release (e.g. tag v2.1.0 → Release)
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write   # Required to push to GitHub Packages

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: snok/install-poetry@v1
        with:
          version: 1.8.2

      - name: Install dependencies
        run: poetry install --sync --with dev

      - name: Run tests
        run: poetry run pytest tests

      - name: Build wheel + sdist
        run: poetry build

      - uses: actions/upload-artifact@v4
        with:
          name: lar-engine-dist
          path: dist/

  publish:
    name: Publish to GitHub Packages
    needs: build_and_test
    runs-on: ubuntu-latest
    environment:
      name: github-packages
      url: https://github.com/snath-ai/lar/packages

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lar-engine-dist
          path: dist/

      - name: Publish to GitHub Packages PyPI registry
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://pypi.pkg.github.com/snath-ai/
          password: ${{ secrets.GITHUB_TOKEN }}
