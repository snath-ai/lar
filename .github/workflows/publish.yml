name: Publish lar-engine

# Trigger: create a GitHub Release (e.g. tag v2.1.1 → Release)
on:
  release:
    types: [published]

permissions:
  contents: write   # Needed to upload wheel to the Release
  packages: write

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: snok/install-poetry@v1
        with:
          version: 1.8.2

      - name: Install dependencies
        run: poetry install --sync --with dev

      - name: Run tests
        run: poetry run pytest tests

      - name: Build wheel + sdist
        run: poetry build

      - uses: actions/upload-artifact@v4
        with:
          name: lar-engine-dist
          path: dist/

  publish:
    name: Attach wheel to GitHub Release
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lar-engine-dist
          path: dist/

      - name: Upload wheel + sdist to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
